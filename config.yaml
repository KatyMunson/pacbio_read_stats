# =============================================================================
# config.yaml — Kinnex FLNC Stats (multi-BAM-per-sample)
# =============================================================================

# Path to the manifest TSV
# Format: sample <TAB> /path/bam1.bam;/path/bam2.bam
manifest: "manifest.tsv"

# Path to the stats script
stats_script: "kinnex_stats_multicore.py"

# Final merged output CSV
out_csv: "results/kinnex_stats.csv"

# Minimum read length filter (0 = no filter)
min_length: 0

resources:
  kinnex_stats:
    threads: 3       # one worker per BAM; set to max BAMs-per-sample (1–3)
    mem: 6           # GB per slot (total = mem * threads = 18 GB)
    hrs: 6
  merge_stats:
    threads: 1
    mem: 4           # GB per slot
    hrs: 1
